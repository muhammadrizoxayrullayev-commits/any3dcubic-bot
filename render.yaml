services:
  - type: web
    name: any3dcubic-bot
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: node server/standalone.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: WEB_APP_URL
        value: https://muhammadrizoxayrullayev-commits.github.io/t3d/
